<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmPal / FF_SmartControl — Architecture Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  #top { display: flex; flex: 1; overflow: hidden; }

  #sidebar {
    width: 220px; min-width: 220px; background: #161b22; border-right: 1px solid #30363d;
    display: flex; flex-direction: column; overflow-y: auto; padding: 12px;
    font-size: 12px;
  }
  #sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d8590; margin: 12px 0 6px; }
  #sidebar h3:first-child { margin-top: 0; }

  .preset-btn {
    display: block; width: 100%; padding: 6px 10px; margin-bottom: 4px;
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; cursor: pointer; text-align: left; font-size: 12px;
    transition: background .15s;
  }
  .preset-btn:hover { background: #2d333b; }
  .preset-btn.active { background: #1f6feb33; border-color: #1f6feb; color: #58a6ff; }

  .layer-toggle { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; }
  .layer-toggle input { cursor: pointer; accent-color: #58a6ff; }
  .layer-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .conn-toggle { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }

  #comments-list { flex: 1; overflow-y: auto; }
  .comment-item {
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    padding: 7px 8px; margin-bottom: 6px; font-size: 11px;
  }
  .comment-item .clabel { font-weight: 600; color: #58a6ff; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
  .comment-item .ctext { color: #8b949e; line-height: 1.4; }
  .comment-del { background: none; border: none; color: #6e7681; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
  .comment-del:hover { color: #f85149; }

  #canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #0d1117; }
  #main-svg { width: 100%; height: 100%; cursor: grab; }
  #main-svg:active { cursor: grabbing; }

  .zoom-controls { position: absolute; bottom: 12px; right: 12px; display: flex; gap: 4px; }
  .zoom-btn {
    width: 28px; height: 28px; background: #21262d; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:hover { background: #2d333b; }

  #prompt-bar {
    background: #161b22; border-top: 1px solid #30363d;
    padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px;
    min-height: 64px; max-height: 120px;
  }
  #prompt-text {
    flex: 1; font-size: 12px; color: #8b949e; line-height: 1.5;
    font-family: 'SF Mono', 'Fira Code', monospace; overflow-y: auto;
    white-space: pre-wrap;
  }
  #copy-btn {
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 5px 12px; font-size: 12px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  #copy-btn:hover { background: #2d333b; }
  #copy-btn.copied { color: #3fb950; border-color: #3fb950; }

  #modal-overlay {
    display: none; position: fixed; inset: 0; background: #000a; z-index: 100;
    align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 20px; width: 380px; display: flex; flex-direction: column; gap: 10px;
  }
  #modal h4 { font-size: 14px; }
  #modal .mpath { font-size: 11px; color: #7d8590; font-family: monospace; }
  #modal textarea {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 8px; font-size: 12px; resize: vertical;
    min-height: 80px; font-family: inherit;
  }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  #modal-save { background: #1f6feb; border: none; color: #fff; }
  #modal-save:hover { background: #388bfd; }
  #modal-cancel { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
  #modal-cancel:hover { background: #2d333b; }
</style>
</head>
<body>

<div id="top">

    <label class="conn-toggle"><input type="checkbox" id="c-safety" checked onchange="render()"><span style="display:inline-block;width:18px;height:2px;background:#f85149;vertical-align:middle;margin-right:6px"></span>Safety Gate</label>
    <label class="conn-toggle"><input type="checkbox" id="c-llm" checked onchange="render()"><span style="display:inline-block;width:18px;height:2px;background:repeating-linear-gradient(90deg,#3fb950 0,#3fb950 6px,transparent 6px,transparent 10px);vertical-align:middle;margin-right:6px"></span>LLM Call</label>
    <label class="conn-toggle"><input type="checkbox" id="c-hw" checked onchange="render()"><span style="display:inline-block;width:18px;height:2px;background:#a371f7;vertical-align:middle;margin-right:6px"></span>Hardware I/O</label>

    <h3>Notes (<span id="comment-count">0</span>)</h3>
    <div id="comments-list"></div>
  </div>

  <div id="canvas-wrap">
    <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr-blue"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
        <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f0883e"/></marker>

        <marker id="arr-green"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3fb950"/></marker>
        <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#a371f7"/></marker>
      </defs>
      <g id="diagram-root"></g>
    </svg>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(1.2)">+</button>
      <button class="zoom-btn" onclick="zoom(0.8)">−</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Reset view">⌂</button>
    </div>
  </div>
</div>

<div id="prompt-bar">

</div>

<div id="modal-overlay">

</div>

  { label:'DATA / SQLite',     y:625, h:58,  layer:'data'     },
];

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  return el;
}

function nodeById(id) { return NODES.find(n => n.id === id); }
function cx(n) { return n.x + n.w / 2; }
function cy(n) { return n.y + n.h / 2; }

function edgePt(a, b) {
  const ax = cx(a), ay = cy(a), bx = cx(b), by = cy(b);
  const dx = bx - ax, dy = by - ay;
  let sx, sy, ex, ey;
  if (Math.abs(dx) > Math.abs(dy)) {
    sx = dx > 0 ? a.x + a.w : a.x; sy = ay;
    ex = dx > 0 ? b.x : b.x + b.w; ey = by;
  } else {
    sx = ax; sy = dy > 0 ? a.y + a.h : a.y;
    ex = bx; ey = dy > 0 ? b.y : b.y + b.h;
  }
  return { sx, sy, ex, ey };
}

function cubicD(sx, sy, ex, ey) {
  const dx = ex - sx, dy = ey - sy;
  return `M${sx},${sy} C${sx + dx*0.4},${sy} ${ex - dx*0.4},${ey} ${ex},${ey}`;
}

function connVisible(c) {
  const a = nodeById(c.from), b = nodeById(c.to);
  if (!a || !b) return false;
  if (!state.layers[a.layer] || !state.layers[b.layer]) return false;
  const el = document.getElementById('c-' + c.type);
  return el ? el.checked : true;
}

function render() {
  const root = document.getElementById('diagram-root');
  while (root.firstChild) root.removeChild(root.firstChild);

  const g = svgEl('g', { transform:`translate(${state.panX},${state.panY}) scale(${state.zoom})` });
  root.appendChild(g);

  // Layer bands
  for (const b of BANDS) {
    if (!state.layers[b.layer]) continue;
    const lc = LAYER_COLORS[b.layer];
    g.appendChild(svgEl('rect', { x:18, y:b.y, width:1295, height:b.h, rx:8, fill:lc.fill, stroke:lc.stroke + '30', 'stroke-width':1 }));
    const t = svgEl('text', { x:26, y:b.y+13, fill:lc.stroke, 'font-size':9, 'font-weight':700, 'letter-spacing':'.07em', 'font-family':'sans-serif' });
    t.textContent = b.label;
    g.appendChild(t);
  }

  // Connections
  for (const c of CONNECTIONS) {
    if (!connVisible(c)) continue;
    const a = nodeById(c.from), b = nodeById(c.to);
    const s = CONN_STYLES[c.type];
    const { sx, sy, ex, ey } = edgePt(a, b);
    g.appendChild(svgEl('path', { d:cubicD(sx,sy,ex,ey), fill:'none', stroke:s.color, 'stroke-width':s.w, 'stroke-dasharray':s.dash, 'marker-end':`url(#${s.marker})`, opacity:.55 }));
    if (c.label) {
      const mx = (sx+ex)/2, my = (sy+ey)/2;
      g.appendChild(svgEl('rect', { x:mx-30, y:my-8, width:60, height:13, rx:3, fill:'#0d1117', opacity:.85 }));
      const lt = svgEl('text', { x:mx, y:my+2, 'text-anchor':'middle', 'font-size':8, fill:s.color, 'font-family':'sans-serif', 'font-weight':600 });
      lt.textContent = c.label;
      g.appendChild(lt);
    }
  }

  // Nodes
  for (const n of NODES) {
    if (!state.layers[n.layer]) continue;
    const lc = LAYER_COLORS[n.layer];
    const hasNote = state.comments.some(c => c.target === n.id);
    const ng = svgEl('g', { transform:`translate(${n.x},${n.y})`, style:'cursor:pointer' });
    ng.addEventListener('click', () => openModal(n));

    // Shadow
    ng.appendChild(svgEl('rect', { x:2, y:2, width:n.w, height:n.h, rx:6, fill:'#000', opacity:.5 }));

    // Body
    ng.appendChild(svgEl('rect', { width:n.w, height:n.h, rx:6, fill:lc.fill, stroke: hasNote ? '#f0883e' : lc.stroke, 'stroke-width': hasNote ? 2.5 : 1.5 }));

    // Note indicator
    if (hasNote) {
      ng.appendChild(svgEl('circle', { cx:n.w-7, cy:7, r:5, fill:'#f0883e' }));
    }

    // Label
    const label = svgEl('text', { x:n.w/2, y:n.h/2-5, 'text-anchor':'middle', 'font-size':11, 'font-weight':700, fill:'#e6edf3', 'font-family':'sans-serif' });
    label.textContent = n.label;
    ng.appendChild(label);

    // Subtitle
    const sub = svgEl('text', { x:n.w/2, y:n.h/2+9, 'text-anchor':'middle', 'font-size':8.5, fill:'#7d8590', 'font-family':'monospace' });
    sub.textContent = n.sub;
    ng.appendChild(sub);

    g.appendChild(ng);
  }

  updatePrompt();
}

// ─────────────────────────────────────────────────────────────
// ZOOM / PAN
// ─────────────────────────────────────────────────────────────
function zoom(f) { state.zoom = Math.max(0.25, Math.min(4, state.zoom * f)); render(); }
function resetZoom() { state.zoom = 0.72; state.panX = 8; state.panY = 8; render(); }

let drag = null;
document.getElementById('main-svg').addEventListener('mousedown', e => {
  if (e.target.closest('[style*="cursor:pointer"]')) return;
  drag = { ox: e.clientX - state.panX, oy: e.clientY - state.panY };
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  state.panX = e.clientX - drag.ox; state.panY = e.clientY - drag.oy;
  render();
});
window.addEventListener('mouseup', () => { drag = null; });
document.getElementById('main-svg').addEventListener('wheel', e => {
  e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive:false });

// ─────────────────────────────────────────────────────────────
// PRESETS
// ─────────────────────────────────────────────────────────────
const PRESETS = {
  full:     { external:true, frontend:true, host:true, agent:true, safety:true, hal:true, device:true, data:true,  zoom:0.72, px:8,  py:8   },
  frontend: { external:true, frontend:true, host:true, agent:false,safety:false,hal:false,device:false,data:true,  zoom:1.0,  px:8,  py:8   },
  agent:    { external:true, frontend:false,host:true, agent:true, safety:true, hal:true, device:false,data:true,  zoom:0.85, px:8,  py:-50 },
  dataflow: { external:false,frontend:true, host:true, agent:false,safety:false,hal:true, device:false,data:true,  zoom:0.9,  px:8,  py:8   },
  hardware: { external:false,frontend:false,host:false,agent:false,safety:true, hal:true, device:true, data:true,  zoom:1.0,  px:8,  py:-280},
};

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  for (const [k,v] of Object.entries(p)) {
    if (k === 'zoom') { state.zoom = v; continue; }
    if (k === 'px') { state.panX = v; continue; }
    if (k === 'py') { state.panY = v; continue; }
    state.layers[k] = v;
    const el = document.getElementById('l-' + k);
    if (el) el.checked = v;
  }
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  const match = document.querySelector(`.preset-btn[onclick*="'${name}'"]`);
  if (match) match.classList.add('active');
  render();
}

function toggleLayer(layer) {
  state.layers[layer] = document.getElementById('l-' + layer).checked;
  render();
}

// ─────────────────────────────────────────────────────────────
// COMMENTS
// ─────────────────────────────────────────────────────────────
let activeNode = null;

function openModal(node) {
  activeNode = node;
  document.getElementById('modal-title').textContent = node.label;
  document.getElementById('modal-path').textContent = node.sub;
  const existing = state.comments.find(c => c.target === node.id);
  document.getElementById('modal-input').value = existing ? existing.text : '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-input').focus(), 40);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  activeNode = null;
}

function saveComment() {
  const text = document.getElementById('modal-input').value.trim();
  if (!text) { closeModal(); return; }
  const idx = state.comments.findIndex(c => c.target === activeNode.id);
  const entry = { id: Date.now(), target: activeNode.id, label: activeNode.label, file: activeNode.sub, text };
  if (idx >= 0) state.comments[idx] = entry;
  else state.comments.push(entry);
  closeModal();
  renderComments();
  render();
}

function deleteComment(id) {
  state.comments = state.comments.filter(c => c.id !== id);
  renderComments();
  render();
}

function renderComments() {
  document.getElementById('comment-count').textContent = String(state.comments.length);
  const list = document.getElementById('comments-list');
  while (list.firstChild) list.removeChild(list.firstChild);

  for (const c of state.comments) {
    const item = document.createElement('div');
    item.className = 'comment-item';

    const header = document.createElement('div');
    header.className = 'clabel';

    const labelSpan = document.createElement('span');
    labelSpan.textContent = c.label;

    const del = document.createElement('button');
    del.className = 'comment-del';
    del.textContent = '✕';
    del.title = 'Remove note';
    del.addEventListener('click', () => deleteComment(c.id));

    header.appendChild(labelSpan);
    header.appendChild(del);

    const body = document.createElement('div');
    body.className = 'ctext';
    body.textContent = c.text;

    item.appendChild(header);
    item.appendChild(body);
    list.appendChild(item);
  }
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveComment();
});

// ─────────────────────────────────────────────────────────────
// PROMPT
// ─────────────────────────────────────────────────────────────
function updatePrompt() {
  const visibleLayers = Object.entries(state.layers).filter(([,v])=>v).map(([k])=>k);
  const allVisible = visibleLayers.length === Object.keys(state.layers).length;

  let text = 'This is the FarmPal / FF_SmartControl architecture';
  if (!allVisible) text += ', showing the ' + visibleLayers.join(', ') + ' layers';
  text += '.\n\n';

  if (state.comments.length === 0) {
    text += 'Click any component to add a note or question. Use presets and layer toggles to focus on a subsystem.';
  } else {
    text += 'Notes and questions:\n\n';
    for (const c of state.comments) {
      text += `**${c.label}** (${c.file}):\n${c.text}\n\n`;
    }
  }

  document.getElementById('prompt-text').textContent = text.trim();
}

function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('prompt-text').textContent).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Prompt'; btn.classList.remove('copied'); }, 1500);
  });
}

// Init
render();
</script>
</body>
</html>
