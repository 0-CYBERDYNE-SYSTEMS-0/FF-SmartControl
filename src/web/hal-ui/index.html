  <title>FF_SmartControl HAL</title>
  <!-- No external CDNs: the controller must work fully offline on the Pi, and
       the locked CSP (script/style/font-src 'self') intentionally blocks remote
       origins. Fonts use the local system stack (tokens.css); charts are pure

  <style>
    /* Inline critical styles to prevent flash */
    html { background: #0D1117; }
    body { visibility: hidden; }
    html.ready body { visibility: visible; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="dist/main.js?v=20260604-kpigrid"></script>
</body>
